# Minimal settings for testing the FMU agent on one host.
#
#   mads broker -s mads.ini
#   ./build/src/main/mads-fmu models/fmu/linear_axis.fmu        # add -t for trigger mode
#   mads echo fmu_linear_axis                                    # prints the plant status
#   mads source                                                  # publishes each JSON line typed on stdin

[agents]
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
settings_address = "tcp://localhost:9092"

[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"

[fmu_linear_axis]
period = 100
pub_topic = "fmu_linear_axis"
sub_topic = ["linear_axis_control"]
relative_tol = 1e-5
absolute_tol = 1e-7
hmin = 1e-12

[fmu_linear_axis.parameters]
# Not the FMU default (0): checks that parameters are applied before initialization
X0 = 0.05

# mads source, with no plugin
[publish]
pub_topic = "linear_axis_control"

# Used only when echo is started with -s; by default it needs no settings
[echo]
sub_topic = ["fmu_linear_axis"]
